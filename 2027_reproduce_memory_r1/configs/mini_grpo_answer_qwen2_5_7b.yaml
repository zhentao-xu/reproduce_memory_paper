# Mini GRPO run on Qwen2.5-7B-Instruct (paper's actual backbone).
# Qwen2.5 series is less "answer-confident" than Qwen3 → better chance of intra-group variance.

stage: answer
run_name: mini_qwen2_5_7b
output_dir: outputs/checkpoints
log_with: none

model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  use_peft: true
  peft_r: 8
  peft_alpha: 16

optim:
  actor_lr: 1.0e-6
  critic_lr: 1.0e-5
  total_batch_size: 8       # ⇒ examples_per_step = 8/4 = 2
  micro_batch_size_per_gpu: 1
  clip_range: 0.2
  kl_coef: 0.02
  max_grad_norm: 1.0

rl:
  algorithm: grpo
  group_size: 4
  grpo_beta: 0.04
  train_temperature: 1.2   # milder than Qwen3-4B run — 7B usually more calibrated
  train_top_p: 0.9
  train_top_k: 50
  train_repetition_penalty: 1.05
  eval_temperature: 0.0
  max_prompt_length: 2048
  max_response_length: 128
  total_steps: 5
  save_every: 5
  seed: 42

data:
  manager_data: data/processed/manager_train.jsonl
  answer_data: data/processed/answer_train_filtered_7b.jsonl   # re-screened for 7B
  top_k_context: 5
  top_k_per_speaker: 5

reward:
  reward_type: f1

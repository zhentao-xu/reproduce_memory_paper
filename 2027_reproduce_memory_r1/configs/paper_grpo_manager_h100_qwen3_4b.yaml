# Paper-scale GRPO fine-tuning of the Memory Manager on 1× H100 with Qwen3-4B-Instruct-2507.
# Stage B — depends on the Stage A checkpoint from paper_grpo_answer_h100_qwen3_4b.yaml.
# BEFORE running this, edit answer_backend.checkpoint below to point at Stage A's LoRA adapter.

stage: manager
run_name: paper_grpo_manager_qwen3_4b
output_dir: outputs/checkpoints
log_with: wandb

model:
  name_or_path: Qwen/Qwen3-4B-Instruct-2507
  dtype: bfloat16
  use_peft: true
  peft_r: 16
  peft_alpha: 32
  peft_dropout: 0.05
  use_gradient_checkpointing: true  # required at G=16 / µ=8 on 4B; 30 % compute for OOM safety

optim:
  actor_lr: 1.0e-6
  critic_lr: 1.0e-5
  total_batch_size: 256
  micro_batch_size_per_gpu: 8
  clip_range: 0.2
  kl_coef: 0.02
  max_grad_norm: 1.0

rl:
  algorithm: grpo
  group_size: 16            # ⇑ from paper 8 for more reward variance per group
  grpo_beta: 0.04
  train_temperature: 1.2
  train_top_p: 0.95
  train_top_k: 0
  train_repetition_penalty: 1.0
  eval_temperature: 0.0
  max_prompt_length: 4096
  max_response_length: 2048
  total_steps: 200
  save_every: 50
  seed: 42

data:
  manager_data: data/processed/manager_train.jsonl
  answer_data: data/processed/answer_train.jsonl
  top_k_context: 10          # Manager sees this many old-memory entries per rollout
  top_k_per_speaker: 15      # Answer Agent (used inside Manager's reward) retrieves this many

reward:
  reward_type: f1  

answer_backend:
  # For paper-faithful reproduction, first train the Answer Agent, then point ``checkpoint`` at
  # that LoRA adapter path.
  name_or_path: Qwen/Qwen3-4B-Instruct-2507
  dtype: bfloat16
  checkpoint: outputs/checkpoints/paper_grpo_answer_qwen3_4b/step_200

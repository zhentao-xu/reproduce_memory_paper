[project]
name = "memory-r1"
version = "0.1.0"
description = "Reproduction of Memory-R1: Enhancing LLM Agents to Manage and Utilize Memories via RL (Yan et al., arXiv:2508.19828)"
readme = "README.md"
authors = [
    { name = "Frank Xu", email = "frank.xu@mindd.ai" }
]
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
    # Core deep learning
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "accelerate>=1.1.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0; sys_platform != 'darwin'",
    # RL fine-tuning (PPO / GRPO). trl>=0.12 has GRPOTrainer.
    "trl>=0.12.0",
    "deepspeed>=0.15.0; sys_platform != 'darwin'",
    # Retrieval / embeddings
    "sentence-transformers>=3.2.0",
    "faiss-cpu>=1.8.0",
    # Data / datasets
    "datasets>=3.0.0",
    "huggingface-hub>=0.26.0",
    # LLM APIs (for GPT-4o-mini fact extraction + LLM-as-a-Judge)
    "openai>=1.55.0",
    "tenacity>=9.0.0",
    # Metrics
    "sacrebleu>=2.4.0",
    "nltk>=3.9.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.5.0",
    # Utilities
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "tqdm>=4.66.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
    # Experiment tracking
    "wandb>=0.18.0",
    # Networking / robust downloads
    "requests>=2.32.0",
    "gdown>=5.2.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.6.0; sys_platform != 'darwin'",
]
# H100 / A100 / L40S extras — install with `pip install --no-build-isolation flash-attn>=2.7.0`
# separately. Not listed as a dependency because pip auto-install compiles from source and may
# fail without CUDA + nvcc on the build host.
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "ipython>=8.28.0",
]

[project.scripts]
memory-r1 = "memory_r1.cli:app"

# setuptools is universally available on any PyPI mirror. We were using uv_build originally,
# but that requires uv_build>=0.11.32 which isn't on every corp mirror.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
